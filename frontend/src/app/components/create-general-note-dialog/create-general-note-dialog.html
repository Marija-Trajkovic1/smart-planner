<h2>Unesite podatke za novu generalnu obavezu</h2>

<mat-dialog-content [formGroup]="generalNoteForm">
    <mat-form-field appearance="outline">
        <mat-label>Naslov dnevne obaveze</mat-label>
        <input matInput
            type="text"
            placeholder="Kupiti mleko i hleb"
            formControlName="title"
            required
        />
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Prioritet Vaše obaveze</mat-label>
        <input matInput
            type="number"
            formControlName="priority"
        />
    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">
        Otkaži
    </button>
    <button mat-raised-button 
        color="primary" 
        [disabled]="generalNoteForm.invalid" 
        (click)="onSaveGeneralNote()">
        Kreiraj
    </button>
</mat-dialog-actions>
