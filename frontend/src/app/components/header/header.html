<mat-toolbar class="main-header custom-header">
  <span class="app-title">Smart Planner</span>

  <span class="spacer"></span>

  <div class="auth-actions">
    @if(router.url === '/login' || router.url === '/register'){
        <button mat-button routerLink="/home">Home</button>
    }
    @else if (!isLoggedIn()){
      <button mat-button routerLink="/login">Log In</button>
      <button mat-raised-button class="btn-register" routerLink="/register">Register</button>
    }
    @else {
        <button mat-button (click)="onLogout()">Logout</button>
    }
  </div>
</mat-toolbar>
